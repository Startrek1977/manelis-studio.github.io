<!DOCTYPE html>
<html lang="en" dir="ltr" data-i18n-pending>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">Manelis Studio — Coming Soon</title>
<meta name="description" data-i18n-attr="content:meta_description" content="Manelis Studio is a jewelry atelier under construction — necklaces, charms, chains, and bundles made to become heirlooms. Coming soon.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#fbf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#003D82" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<!--
  locales/data.js is a plain <script src>, not fetch()/JSON, so the page
  localizes correctly whether opened as file:///.../index.html or served
  over http(s) — browsers block fetch() on file:// but not script loading.
-->
<script src="locales/data.js"></script>
<script>
  // Synchronous boot: resolve the locale via the shared resolver in
  // locales/data.js and set lang/dir/pending before assets/i18n.js runs, so
  // a returning or non-English-browser visitor never sees a flash of
  // English — either in rendered content or in the <html lang> metadata
  // exposed to assistive tech and crawlers.
  (function () {
    var html = document.documentElement;
    try {
      var data = window.MANELIS_I18N;
      if (!data) return;
      var meta = data.resolveLocale();
      html.setAttribute('lang', meta.code);
      html.setAttribute('dir', meta.dir || 'ltr');
      if (meta.code === data.manifest.default) html.removeAttribute('data-i18n-pending');
    } catch (e) {
      html.removeAttribute('data-i18n-pending');
    }
  })();
</script>
<noscript><style>html[data-i18n-pending] .card { visibility: visible !important; }</style></noscript>
<style>
  :root {
    --cream: #fbf6ef;
    --blush-soft: #f8e9e6;
    --sky-soft: #e6f1f5;
    --gold: #b6893f;
    --gold-soft: #cda863;
    --ink: #003D82;
    --ink-soft: #7a6f63;
    --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-sans: 'Jost', 'Segoe UI', Tahoma, Geneva, sans-serif;
  }

  html[data-i18n-pending] .card { visibility: hidden; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: var(--font-sans);
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 15%, var(--sky-soft) 0%, transparent 45%),
      radial-gradient(circle at 88% 20%, var(--blush-soft) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, var(--sky-soft) 0%, transparent 55%),
      var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    overflow-x: hidden;
  }

  .card {
    max-width: 640px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .ornament {
    width: 56px;
    height: 56px;
    color: var(--gold-soft);
    margin-bottom: 1.5rem;
  }

  .brand {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 0;
    line-height: 1.1;
  }

  .brand em {
    font-style: italic;
    font-weight: 500;
    color: var(--gold);
  }

  .scallop-divider {
    width: 220px;
    max-width: 60vw;
    height: 16px;
    margin: 1.5rem 0 1.75rem;
    background:
      radial-gradient(circle at 10px 0, transparent 9px, var(--gold-soft) 10px) 0 0 / 20px 20px repeat-x;
    opacity: 0.85;
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 0.85rem;
  }

  .headline {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.35rem, 3.6vw, 1.85rem);
    color: var(--ink);
    margin: 0 0 1.1rem;
    line-height: 1.4;
  }

  .tagline {
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    color: var(--ink-soft);
    line-height: 1.7;
    max-width: 30rem;
    margin: 0 0 2.25rem;
  }

  .tagline strong {
    font-weight: 500;
    color: var(--ink);
  }

  .footnote {
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  .lang-switcher {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4em 0.7em;
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid rgba(182, 137, 63, 0.25);
    font-family: var(--font-sans);
    font-size: 0.78rem;
    letter-spacing: 0.02em;
  }

  .lang-switcher a {
    display: inline-flex;
    align-items: center;
    gap: 0.42em;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 0.15em 0.1em;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .flag-icon {
    display: inline-block;
    flex: 0 0 auto;
    width: 1.3em;
    height: 0.87em;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
  }

  .flag-icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .lang-switcher a:hover,
  .lang-switcher a:focus-visible {
    color: var(--ink);
  }

  .lang-switcher a.is-active {
    color: var(--gold);
    font-weight: 500;
    border-bottom-color: var(--gold-soft);
  }

  @media (max-width: 420px) {
    body { padding: 8vh 6vw; }
    .ornament { width: 44px; height: 44px; margin-bottom: 1.1rem; }
    .scallop-divider { margin: 1.1rem 0 1.4rem; }
    .tagline { margin-bottom: 1.75rem; }
    .lang-switcher { margin-top: 1.5rem; padding-top: 1rem; }
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="ornament" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 10c3.5 4 3.5 9 0 13-3.5-4-3.5-9 0-13z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M18 22c5-1.5 9 1 11 6-5 1.5-9-1-11-6z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M46 22c-5-1.5-9 1-11 6 5 1.5 9-1 11-6z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M32 28v20"/>
        <path d="M32 34c-4 1-6 4-6 8M32 40c4 1 6 4 6 8"/>
        <circle cx="32" cy="26" r="2.4" fill="currentColor"/>
      </g>
    </svg>

    <h1 class="brand">Manelis <em>Studio</em></h1>

    <div class="scallop-divider" role="presentation"></div>

    <p class="eyebrow" data-i18n="eyebrow">Under Construction</p>
    <p class="headline" data-i18n="headline">Something delicate is being made ready.</p>
    <p class="tagline" data-i18n-slot="tagline" data-i18n-slot-highlight="tagline_highlight">
      We're stringing together a new home for <strong>necklaces, charms, chains &amp; bundles</strong>
      designed to become tomorrow's heirlooms. Thank you for your patience while we set the table.
    </p>

    <p class="footnote" dir="ltr">&mdash; Manelis Studio &mdash;</p>

    <nav class="lang-switcher" data-i18n-switcher aria-label="Language"></nav>
  </main>

  <script defer src="assets/flags.js"></script>
  <script defer src="assets/i18n.js"></script>
</body>
</html>
